  <title>Holographic Math — 3D Particle Graph Morphing</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
      height: 100%;
      overflow: hidden;
      background: #050510;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #eef;
      overscroll-behavior: none;
    }

    canvas {
        display: block;
      touch-action: none;
    }

    #panel {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 10;
      width: 300px;
      max-width: calc(100vw - 16px);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      padding: 14px 16px;
      user-select: none;
      -webkit-user-select: none;
      border-radius: 16px;
      background: rgba(8, 10, 28, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(120, 160, 255, 0.16);
      box-shadow: 0 12px 40px rgba(0, 0, 20, 0.6);
    }

    #panel::-webkit-scrollbar {
      width: 6px;
    }

    #panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    #panelHead {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #panel .title {
        font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #8fa6e8;
      opacity: 0.85;
    }

    #collapseBtn {
      all: unset;
      cursor: pointer;
      font-size: 14px;
      color: #8fa6e8;
      padding: 0 4px;
      border-radius: 6px;
    }

    #collapseBtn:hover {
      color: #fff;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .btn {
      all: unset;
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12.5px;
      color: #c6d2ff;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      }

    .btn:hover {
      background: rgba(90, 140, 255, 0.16);
      color: #fff;
    }

    .btn.active {
      background: linear-gradient(135deg, rgba(70, 120, 255, 0.34), rgba(200, 85, 255, 0.24));
      border-color: rgba(140, 170, 255, 0.6);
      color: #fff;
      box-shadow: 0 0 20px rgba(90, 140, 255, 0.35);
    }

    .divider {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      margin: 11px 0;
    }

    .label {
        font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #8fa6e8;
      opacity: 0.8;
      margin-bottom: 6px;
      display: block;
    }

    .eqbox {
        display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .eqrow {
      display: flex;
      gap: 6px;
      align-items: stretch;
    }

    #eq,
    #eq2 {
      flex: 1;
      min-width: 0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #eef;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px;
      padding: 7px 9px;
      outline: none;
      transition: border-color 0.2s;
    }

    #eq:focus,
    #eq2:focus {
      border-color: rgba(120, 160, 255, 0.6);
    }

    #eq.err,
    #eq2.err {
      border-color: rgba(255, 110, 140, 0.7);
    }

    .eqgo {
      all: unset;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #c6d2ff;
      font-size: 11px;
      letter-spacing: 0.05em;
      transition: all 0.2s;
       }

    .eqgo:hover {
      background: rgba(90, 140, 255, 0.2);
      color: #fff;
    }

    .gallery select {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #eef;
      font-size: 11.5px;
      padding: 6px 8px;
      outline: none;
    }

    .gallery select option,
    .row select option {
      background: #0b0d22;
      color: #eef;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .chip {
      all: unset;
      cursor: pointer;
      font-size: 10px;
      color: #aebaf0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 999px;
      padding: 3px 9px;
      transition: all 0.15s;
      }

    .chip:hover {
      background: rgba(90, 140, 255, 0.18);
      color: #fff;
    }

    .eqhint {
      font-size: 9.5px;
      line-height: 1.5;
      color: rgba(200, 214, 255, 0.45);
      word-break: break-word;
    }

    .eqhint.err {
      color: #ff8fa3;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 7px 0;
    }

    .row label {
      flex: 0 0 78px;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: #aebaf0;
      text-transform: uppercase;
    }

    .row input[type="range"] {
      flex: 1;
      min-width: 0;
      accent-color: #7a9cff;
    }

    .row output {
      flex: 0 0 40px;
      text-align: right;
      font-size: 10px;
      color: #aebaf0;
      font-variant-numeric: tabular-nums;
    }

    .row select {
      flex: 1;
      min-width: 0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #eef;
      font-size: 11px;
      padding: 5px 6px;
      outline: none;
    }

    .row input[type="color"] {
       width: 34px;
      height: 26px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 1px;
      cursor: pointer;
    }

    .consts {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 4px 0 10px;
    }

    .consts button {
      all: unset;
      cursor: pointer;
      flex: 1;
      min-width: 42px;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.05em;
      padding: 5px 0;
      border-radius: 7px;
      color: #cdd6f7;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .consts button:hover {
      color: #fff;
      background: rgba(120, 160, 255, 0.18);
    }

    #eqrow2 .label {
      font-size: 9.5px;
      flex-basis: auto;
      white-space: nowrap;
      margin-bottom: 0;
      align-self: center;
    }

    #eqrow2 input:disabled {
      opacity: 0.35;
    }

    .toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .tbtn {
      all: unset;
      cursor: pointer;
      flex: 1 1 42%;
      min-width: 0;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.06em;
      padding: 7px 0;
      border-radius: 8px;
      color: #aebaf0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.15s;
    }

    .tbtn:hover {
      color: #fff;
    }

    .tbtn.active {
      color: #fff;
      border-color: rgba(140, 170, 255, 0.6);
      background: rgba(70, 120, 255, 0.3);
    }

    #panel .hint {
      margin-top: 12px;
      font-size: 10px;
      line-height: 1.6;
      color: rgba(200, 214, 255, 0.5);
    }

    #shapeLabel {
      position: fixed;
      bottom: 26px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: rgba(160, 190, 255, 0.55);
      pointer-events: none;
      text-shadow: 0 0 22px rgba(80, 130, 255, 0.4);
      }

    #fps {
      position: fixed;
      top: 20px;
      right: 22px;
      z-index: 9;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px;
      line-height: 1.5;
      white-space: pre-line;
      letter-spacing: 0.05em;
      color: rgba(190, 214, 255, 0.6);
      text-shadow: 0 0 12px rgba(80, 130, 255, 0.35);
      pointer-events: none;
    }

    #helpBtn {
      all: unset;
      cursor: pointer;
      margin-left: 6px;
      width: 18px;
      height: 18px;
      line-height: 16px;
      text-align: center;
      font-size: 11px;
      border-radius: 50%;
      color: #8fa6e8;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      }

    #helpBtn:hover {
      color: #fff;
      border-color: rgba(140, 170, 255, 0.5);
    }

    #helpModal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(2, 4, 16, 0.66);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    #helpModal.show {
      display: flex;
    }

    #helpCard {
      width: min(560px, calc(100vw - 32px));
      max-height: 82vh;
      overflow-y: auto;
      padding: 22px 26px;
      border-radius: 18px;
      background: rgba(10, 13, 34, 0.9);
      border: 1px solid rgba(120, 160, 255, 0.2);
      box-shadow: 0 24px 80px rgba(0, 0, 30, 0.8);
      color: #dfe6ff;
    }

    #helpCard h2 {
      margin: 0 0 10px;
      font-size: 15px;
      letter-spacing: 0.14em;
      color: #c6d2ff;
      text-transform: uppercase;
    }

    #helpCard h3 {
      margin: 16px 0 6px;
      font-size: 12px;
      color: #8fa6e8;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    #helpCard p,
    #helpCard li {
      font-size: 12.5px;
      line-height: 1.7;
      color: rgba(223, 230, 255, 0.85);
    }

    #helpCard code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 5px;
      padding: 1px 5px;
      color: #bcd2ff;
    }

    #helpCard ul {
      margin: 4px 0 0;
      padding-left: 18px;
    }

    #helpCard .helprow {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    #helpCard .helprow button {
      flex: 1;
    }

    .okbtn {
      all: unset;
      cursor: pointer;
      text-align: center;
      font-size: 12px;
      padding: 9px 0;
      border-radius: 10px;
      color: #fff;
      background: linear-gradient(135deg, rgba(70, 120, 255, 0.4), rgba(200, 85, 255, 0.3));
      border: 1px solid rgba(140, 170, 255, 0.5);
    }

    .okbtn:hover {
      filter: brightness(1.15);
    }

    .subbtn {
      all: unset;
      cursor: pointer;
      text-align: center;
      font-size: 12px;
      padding: 9px 0;
      border-radius: 10px;
      color: #aebaf0;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .subbtn:hover {
      color: #fff;
    }

    @media (max-width: 640px) {
      #panel {
        top: 8px;
        left: 8px;
        max-width: calc(100vw - 16px);
        max-height: 55vh;
      }

      #fps {
        top: auto;
        bottom: 44px;
        right: 10px;
        font-size: 9.5px;
      }

      #shapeLabel {
        font-size: 10px;
        bottom: 16px;
      }

      .row label {
        flex-basis: 58px;
      }
    }
  </style>
  </head>

<body>
  <div id="panel">
    <div id="panelHead">
      <div style="display:flex; align-items:center; gap:8px;">
        <div class="title">Holographic Math Graphs</div>
        <button id="helpBtn" title="how it works">?</button>
      </div>
      <button id="collapseBtn" title="minimize">&#8722;</button>
      </div>
    <div id="panelBody">
      <div class="buttons" id="shapeButtons">
        <button class="btn active" data-shape="0">Torus</button>
        <button class="btn" data-shape="1">Mobius</button>
        <button class="btn" data-shape="2">Sphere</button>
        <button class="btn" data-shape="3">Lorenz</button>
        <button class="btn" data-shape="4">Custom Eq</button>
      </div>
      <div class="divider"></div>
      <div class="eqbox">
        <span class="label">Particles respond to your equation</span>
        <div class="eqrow">
          <input id="eq" type="text" spellcheck="false" autocomplete="off" value="z = sin(x)*cos(y)" />
          <button id="eqGo" class="eqgo" title="Render equation (Enter)">GO</button>
        </div>
        <div class="gallery">
          <select id="eqGallery" title="preset equations">
            <option value="">— gallery —</option>
            <option value="z = sin(x)*cos(y)">wave plane</option>
            <option value="z = sin(x*x + y*y)">concentric burst</option>
            <option value="z = cos(sqrt(x*x + y*y))">ripples</option>
            <option value="z = x*x/4 - y*y/4">saddle</option>
            <option value="z = sin(3*x)*cos(2*y)">lattice</option>
            <option value="y = x^3 - x">cubic curve</option>
            <option value="y = sin(2*x)*cos(x)">curve wave</option>
            <option value="[ (2+cos(v))*cos(u), (2+cos(v))*sin(u), sin(v) ]">torus (parametric)</option>
            <option value="[ 2*cos(u)*sin(v), 2*sin(u)*sin(v), 2*cos(v) ]">sphere (parametric)</option>
            <option value="x^2 + y^2 + z^2 - 4 = 0">sphere (implicit)</option>
            <option value="(sqrt(x*x + y*y) - 2)^2 + z*z - 0.5 = 0">torus (implicit)</option>
            <option value="x*x/4 + y*y/9 + z*z - 1 = 0">ellipsoid</option>
            <option value="x^2 + y^2 - 4 = 0">circle (2D implicit)</option>
            <option value="(x*x + y*y - 2)^2 + z*z - 0.5 = 0">ring (implicit)</option>
            <option value="z = sin(x + t)*cos(y)">wave · time t</option>
            <option value="z = sin(x*x + y*y + t*3)">burst · time t</option>
            <option value="y = sin(x + t)">curve · time t</option>
            <option value="[ (2+cos(v))*cos(u + t), (2+cos(v))*sin(u + t), sin(v) ]">spin torus · time t</option>
            <option value="r = 3*sin(3*θ)">rose · polar</option>
            <option value="r = 4*(1 + cos(θ))">cardioid · polar</option>
            <option value="r = 4*θ">spiral · polar</option>
            <option value="r = 2*sin(2*θ)*cos(2*θ)">four-leaf · polar</option>
            <option value="(x^2 + y^2 - a*x)^2 = a^2*(x^2 + y^2)">cardioid · implicit</option>
            <option value="d/dt = [y, -x + 0.1*y*(1 - x*x - y*y), 0]">limit cycle (ODE)</option>
            <option value="d/dt = [10*(y-x), x*(28-z)-y, x*y-8/3*z]">Lorenz (ODE)</option>
            <option value="d/dt = [-y-z, x+0.2*y, 0.2+z*(x-5.7)]">Rössler (ODE)</option>
            <option value="d/dt = [z, -x, -y+0.3*x]">spiral flow (ODE)</option>
