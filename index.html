    * {

    }

    html,
    body {

      background: #050510;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #eef;
      overscroll-behavior: none;
    }

    canvas {
        display: block;
      touch-action: none;
    }

    #panel {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 10;
      width: 300px;
      max-width: calc(100vw - 16px);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      padding: 14px 16px;
      user-select: none;
      -webkit-user-select: none;
      border-radius: 16px;
      background: rgba(8, 10, 28, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(120, 160, 255, 0.16);
      box-shadow: 0 12px 40px rgba(0, 0, 20, 0.6);
    }

    #panel::-webkit-scrollbar {
      width: 6px;
    }

    #panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    #panelHead {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #panel .title {
        font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #8fa6e8;
      opacity: 0.85;
    }

    #collapseBtn {
      all: unset;
      cursor: pointer;
      font-size: 14px;
      color: #8fa6e8;
      padding: 0 4px;
      border-radius: 6px;
    }

    #collapseBtn:hover {
      color: #fff;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

      cursor: pointer;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12.5px;
      color: #c6d2ff;

      border: 1px solid rgba(255, 255, 255, 0.08);

      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      background: rgba(90, 140, 255, 0.16);
      color: #fff;
    }
